repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # C++ formatting is advisory (.clang-format approximates the established
  # JUCE-influenced style): the measurement core is kept byte-identical to
  # the code that produced the DAFx-26 results, so no enforced reformat.

  - repo: local
    hooks:
      - id: forbid-model-binaries
        name: forbid committed model binaries and OS junk
        entry: model binaries (.onnx/.pt/.mlmodelc/.mlpackage) and .DS_Store must not be committed
        language: fail
        files: '(\.onnx|\.onnx\.data|\.pt|\.mlmodelc|\.mlpackage|\.DS_Store)'
